name: Build Dev (Patched Upstream)

on:
  workflow_dispatch:
    inputs:
      build_cpu:
        description: 'Build CPU version'
        type: boolean
        default: true
      build_cuda:
        description: 'Build CUDA version'
        type: boolean
        default: true
      cuda_arch:
        description: 'CUDA architectures (semicolon separated)'
        type: string
        default: '75;80;86;89;90;120'

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build-cpu:
    name: Build CPU (Dev)
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cpu }}

    steps:
    - name: Checkout dev branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Apply Windows patches
      # 仅 dev 分支存在 patches 目录时执行；master 生产树已打补丁，自动跳过
      if: hashFiles('patches/apply-patches.sh') != ''
      run: |
        git config core.autocrlf false
        git add --renormalize .
        git reset --hard -q
        bash patches/apply-patches.sh

    - name: Setup MSVC Developer Environment
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Get version from setup.py
      id: version
      shell: bash
      run: |
        VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' tools/scripts/setup.py | head -1)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Detected version: ${VERSION}"

    - name: Configure CMake (CPU)
      run: |
        mkdir build
        cd build
        cmake .. -A x64 `
          -DCMAKE_CXX_STANDARD=20 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_EXTENSIONS=OFF `
          -DUSE_MMAP=ON `
          -DUSE_SENTENCEPIECE=ON `
          -DUNIT_TEST=OFF `
          -DPY_API=ON

    - name: Build (CPU Release)
      run: |
        cd build
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

    - name: Prepare Release Package (CPU)
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        shopt -s nullglob

        mkdir -p release-cpu/bin
        mkdir -p release-cpu/ftllm
        mkdir -p release-cpu/web
        mkdir -p release-cpu/docs

        # Copy executables - ftllm.exe to root, others to bin/
        for exe in build/Release/*.exe; do
          [ -f "$exe" ] || continue
          name=$(basename "$exe")
          if [ "$name" = "ftllm.exe" ]; then
            cp "$exe" release-cpu/
          else
            cp "$exe" release-cpu/bin/
          fi
        done

        # Copy Python module (.pyd)
        cp build/Release/*.pyd release-cpu/ftllm/ 2>/dev/null || true

        # Copy fastllm_tools.dll (ctypes native library)
        if [ -f "build/tools/ftllm/fastllm_tools.dll" ]; then
          cp build/tools/ftllm/fastllm_tools.dll release-cpu/ftllm/
        fi

        # Copy VC++ runtime (与 master 打包结构一致: 仅 bin)
        if [ -d "runtime_libs/vcrt" ]; then
        cp runtime_libs/vcrt/*.dll release-cpu/bin/ 2>/dev/null || true
        fi

        # Copy Python tools from source (exclude root __init__.py; it will be generated)
        while IFS= read -r -d '' srcFile; do
          relPath="${srcFile#tools/fastllm_pytools/}"
          if [ "$relPath" = "__init__.py" ]; then
            continue
          fi
          mkdir -p "release-cpu/ftllm/$(dirname "$relPath")"
          cp "$srcFile" "release-cpu/ftllm/$relPath"
        done < <(find tools/fastllm_pytools -type f -print0 2>/dev/null)

        # Generate __init__.py with correct version
        printf '%s\n' \
          '__all__ = ["llm"]' \
          '' \
          'try:' \
          '    from importlib.metadata import version' \
          '    __version__ = version("ftllm")' \
          'except:' \
          '    try:' \
          '        __version__ = version("ftllm-rocm")' \
          '    except:' \
          '        __version__ = "'"${VERSION}"'"' \
          > release-cpu/ftllm/__init__.py

        # Copy __main__.py for python -m ftllm
        cp tools/fastllm_pytools/__main__.py release-cpu/ftllm/__main__.py 2>/dev/null || true

        # Copy web resources
        if [ -d "example/webui/web" ]; then
          cp -r example/webui/web/* release-cpu/web/
        fi

        # Copy docs (only top-level docs/*.md; exclude 使用说明.md for root)
        for md in docs/*.md; do
          if [ "$(basename "$md")" != "使用说明.md" ]; then
            cp "$md" release-cpu/docs/
          fi
        done
        for f in README*.md; do
          [ -f "$f" ] && cp "$f" release-cpu/docs/
        done

        # Copy 使用说明.md to root
        if [ -f "docs/使用说明.md" ]; then
          cp docs/使用说明.md release-cpu/
        fi

    - name: Create ZIP (CPU)
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        Compress-Archive -Path release-cpu\* -DestinationPath "fastllm-win-x64-cpu-dev-v$version.zip" -Force

    - name: Upload CPU Package
      uses: actions/upload-artifact@v7
      with:
        name: fastllm-dev-cpu-v${{ steps.version.outputs.version }}
        path: fastllm-win-x64-cpu-dev-v${{ steps.version.outputs.version }}.zip
        retention-days: 30

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: dev-cpu-build-logs
        path: |
          build/
          !build/**/*.obj
          !build/**/*.pdb
        retention-days: 7

  build-cuda:
    name: Build CUDA (Dev)
    runs-on: windows-2022  # CUDA 13.1 官方支持 VS2022; windows-latest 已迁移 VS2026, CUDA 13.1 的 cudafe++ 会崩溃
    needs: build-cpu  # 串行执行: 避免 CPU/CUDA 并行安装大工具链导致 Actions 容量不足
    # CPU 构建失败(非取消)时 CUDA 仍会执行; 注意若 CPU 被取消, GitHub 不会继续 CUDA(即使 always()), 日常不要取消 CPU
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_cuda) }}

    steps:
    - name: Checkout dev branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Apply Windows patches
      # 仅 dev 分支存在 patches 目录时执行；master 生产树已打补丁，自动跳过
      if: hashFiles('patches/apply-patches.sh') != ''
      run: |
        git config core.autocrlf false
        git add --renormalize .
        git reset --hard -q
        bash patches/apply-patches.sh

    - name: Setup MSVC Developer Environment
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Get version from setup.py
      id: version
      shell: bash
      run: |
        VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' tools/scripts/setup.py | head -1)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Detected version: ${VERSION}"

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.36
      id: cuda-toolkit
      with:
        cuda: '13.1.0'
        method: 'local'  # 完整安装，包含所有头文件

    - name: Display CUDA version
      run: |
        echo "CUDA Version: ${{ steps.cuda-toolkit.outputs.cuda }}"
        echo "CUDA Path: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
        nvcc --version

    - name: Configure CMake (CUDA)
      run: |
        $cudaArch = "${{ github.event.inputs.cuda_arch || '75;80;86;89;90;120' }}"
        mkdir build-cuda
        cd build-cuda
        cmake .. -A x64 `
          -DCMAKE_CXX_STANDARD=20 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_EXTENSIONS=OFF `
          -DUSE_CUDA=ON `
          -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -Xcompiler /Zc:preprocessor" `
          -DCUDA_ARCH="$cudaArch" `
          -DUSE_MMAP=ON `
          -DUSE_SENTENCEPIECE=ON `
          -DUNIT_TEST=OFF `
          -DPY_API=ON
      env:
        CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

    - name: Build (CUDA Release)
      run: |
        cd build-cuda
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

    - name: Prepare Release Package (CUDA)
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        shopt -s nullglob

        mkdir -p release-cuda/bin
        mkdir -p release-cuda/ftllm
        mkdir -p release-cuda/web
        mkdir -p release-cuda/docs

        # Copy executables - ftllm.exe to root, others to bin/
        for exe in build-cuda/Release/*.exe; do
          [ -f "$exe" ] || continue
          name=$(basename "$exe")
          if [ "$name" = "ftllm.exe" ]; then
            cp "$exe" release-cuda/
          else
            cp "$exe" release-cuda/bin/
          fi
        done

        # Copy Python module (.pyd)
        cp build-cuda/Release/*.pyd release-cuda/ftllm/ 2>/dev/null || true

        # Copy fastllm_tools.dll (ctypes native library)
        if [ -f "build-cuda/tools/ftllm/fastllm_tools.dll" ]; then
          cp build-cuda/tools/ftllm/fastllm_tools.dll release-cuda/ftllm/
        fi

        # Copy VC++ runtime (与 master 打包结构一致: 仅 bin)
        if [ -d "runtime_libs/vcrt" ]; then
        cp runtime_libs/vcrt/*.dll release-cuda/bin/ 2>/dev/null || true
        fi

        # Copy CUDA runtime DLLs
        CUDA_BIN="${CUDA_PATH}/bin"
        if [ -d "${CUDA_BIN}" ]; then
          cp "${CUDA_BIN}/cublas64_"*.dll release-cuda/bin/ 2>/dev/null || true
          cp "${CUDA_BIN}/cublasLt64_"*.dll release-cuda/bin/ 2>/dev/null || true
          cp "${CUDA_BIN}/cudart64_"*.dll release-cuda/bin/ 2>/dev/null || true
        fi

        # For CUDA 13.x, DLLs might be in bin/x64
        CUDA_BIN_X64="${CUDA_PATH}/bin/x64"
        if [ -d "${CUDA_BIN_X64}" ]; then
          cp "${CUDA_BIN_X64}/cublas64_"*.dll release-cuda/bin/ 2>/dev/null || true
          cp "${CUDA_BIN_X64}/cublasLt64_"*.dll release-cuda/bin/ 2>/dev/null || true
          cp "${CUDA_BIN_X64}/cudart64_"*.dll release-cuda/bin/ 2>/dev/null || true
        fi

        # Copy Python tools from source (exclude root __init__.py; it will be generated)
        while IFS= read -r -d '' srcFile; do
          relPath="${srcFile#tools/fastllm_pytools/}"
          if [ "$relPath" = "__init__.py" ]; then
            continue
          fi
          mkdir -p "release-cuda/ftllm/$(dirname "$relPath")"
          cp "$srcFile" "release-cuda/ftllm/$relPath"
        done < <(find tools/fastllm_pytools -type f -print0 2>/dev/null)

        # Generate __init__.py with correct version
        printf '%s\n' \
          '__all__ = ["llm"]' \
          '' \
          'try:' \
          '    from importlib.metadata import version' \
          '    __version__ = version("ftllm")' \
          'except:' \
          '    try:' \
          '        __version__ = version("ftllm-rocm")' \
          '    except:' \
          '        __version__ = "'"${VERSION}"'"' \
          > release-cuda/ftllm/__init__.py

        # Copy __main__.py for python -m ftllm
        cp tools/fastllm_pytools/__main__.py release-cuda/ftllm/__main__.py 2>/dev/null || true

        # Copy web resources
        if [ -d "example/webui/web" ]; then
          cp -r example/webui/web/* release-cuda/web/
        fi

        # Copy docs (only top-level docs/*.md; exclude 使用说明.md for root)
        for md in docs/*.md; do
          if [ "$(basename "$md")" != "使用说明.md" ]; then
            cp "$md" release-cuda/docs/
          fi
        done
        for f in README*.md; do
          [ -f "$f" ] && cp "$f" release-cuda/docs/
        done

        # Copy 使用说明.md to root
        if [ -f "docs/使用说明.md" ]; then
          cp docs/使用说明.md release-cuda/
        fi
      env:
        CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

    - name: Create ZIP (CUDA)
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        Compress-Archive -Path release-cuda\* -DestinationPath "fastllm-win-x64-cuda-dev-v$version.zip" -Force

    - name: Upload CUDA Package
      uses: actions/upload-artifact@v7
      with:
        name: fastllm-dev-cuda-v${{ steps.version.outputs.version }}
        path: fastllm-win-x64-cuda-dev-v${{ steps.version.outputs.version }}.zip
        retention-days: 30

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: dev-cuda-build-logs
        path: |
          build-cuda/
          !build-cuda/**/*.obj
          !build-cuda/**/*.pdb
        retention-days: 7
