name: Build Dev (Patched Upstream)on:  workflow_dispatch:    inputs:      build_cpu:        description: 'Build CPU version'        type: boolean        default: true      build_cuda:        description: 'Build CUDA version'        type: boolean        default: falseenv:  BUILD_TYPE: Releasepermissions:  contents: readjobs:  build-cpu:    name: Build CPU (Dev)    runs-on: windows-latest    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cpu }}        steps:    - name: Checkout dev branch      uses: actions/checkout@v4      with:        fetch-depth: 0        submodules: false        - name: Configure Git      run: |        git config user.name "github-actions[bot]"        git config user.email "github-actions[bot]@users.noreply.github.com"        - name: Apply Windows patches      shell: pwsh      run: |        Write-Host "=== Applying Windows patches ==="        git apply --whitespace=nowarn patches/source-patches/01-platform-abstraction.patch        git apply --whitespace=nowarn patches/source-patches/02-cuda-nccl-guard.patch        git apply --whitespace=nowarn patches/source-patches/03-template-tojson.patch        git apply --whitespace=nowarn patches/source-patches/04-pybinding-log.patch        git apply --whitespace=nowarn patches/source-patches/05-test-fixes.patch        git apply --whitespace=nowarn patches/source-patches/06-avx2-fastllm-log.patch        git apply --whitespace=nowarn patches/source-patches/07-pytools-adapt.patch        git apply --whitespace=nowarn patches/source-patches/08-python-tools.patch        git apply --whitespace=nowarn patches/source-patches/09-gitmodules.patch        Copy-Item patches/platform-layer/*.h include/utils/ -Force        Copy-Item patches/features/include/utils/* include/utils/ -Force        Copy-Item patches/features/src/chat_handler.cpp src/ -Force        Copy-Item patches/features/ftllm.cpp . -Force        Copy-Item patches/cmake/CMakeLists.windows.txt CMakeLists.txt -Force        Write-Host "=== Patches applied ==="        - name: Setup MSVC Developer Environment      uses: ilammy/msvc-dev-cmd@v1      with:        arch: x64        - name: Setup Python      uses: actions/setup-python@v5      with:        python-version: '3.11'        - name: Configure CMake (CPU)      run: |        mkdir build        cd build        cmake .. -A x64 `          -DCMAKE_CXX_STANDARD=20 `          -DCMAKE_CXX_STANDARD_REQUIRED=ON `          -DCMAKE_CXX_EXTENSIONS=OFF `          -DUSE_MMAP=ON `          -DUSE_SENTENCEPIECE=ON `          -DPY_API=ON        - name: Build (CPU Release)      run: |        cd build        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS        - name: Upload build logs on failure      if: failure()      uses: actions/upload-artifact@v4      with:        name: dev-cpu-build-logs        path: |          build/          !build/**/*.obj          !build/**/*.pdb        retention-days: 7