name: Build Dev (Patched Upstream)

on:
  workflow_dispatch:
    inputs:
      build_cpu:
        description: 'Build CPU version'
        type: boolean
        default: true
      build_cuda:
        description: 'Build CUDA version'
        type: boolean
        default: false

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build-cpu:
    name: Build CPU (Dev)
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cpu }}
    
    steps:
    - name: Checkout dev branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Configure CMake (CPU)
      run: |
        mkdir build
        cd build
        cmake .. -A x64 `
          -DCMAKE_CXX_STANDARD=20 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_EXTENSIONS=OFF `
          -DUSE_MMAP=ON `
          -DUSE_SENTENCEPIECE=ON `
          -DPY_API=ON
    
    - name: Build (CPU Release)
      run: |
        cd build
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dev-cpu-build-logs
        path: |
          build/
          !build/**/*.obj
          !build/**/*.pdb
        retention-days: 7
